<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="60" rx="8" fill="white" fill-opacity="0.1"/>
  
  <!-- 234 in bold -->
  <text x="15" y="42" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="white">
    234
  </text>
  
  <!-- Mile in regular weight -->
  <text x="85" y="42" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="white">
    Mile
  </text>
  
  <!-- Small Nigerian flag emoji alternative - green and white stripes -->
  <g transform="translate(170, 20)">
    <rect width="20" height="20" rx="2" fill="white" fill-opacity="0.2"/>
    <rect width="6" height="20" rx="1" fill="#008751"/>
    <rect x="7" width="6" height="20" rx="1" fill="white"/>
    <rect x="14" width="6" height="20" rx="1" fill="#008751"/>
  </g>
</svg>
